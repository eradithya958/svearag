name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-test:
    name: Lint, Test & Coverage Gate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with Ruff
        run: |
          ruff check .
          ruff format --check .

      - name: Run Pytest with Coverage Gate (>=85%)
        run: |
          pytest --cov=src/svearag --cov-report=term-missing --cov-report=xml --cov-fail-under=85

      - name: Document Ingestion Smoke Test
        run: |
          python -c "
          from svearag.ingestion.pipeline import IngestionPipeline
          from pathlib import Path
          pipeline = IngestionPipeline(raw_dir=Path('data/raw'), processed_dir=Path('data/processed'))
          docs, chunks = pipeline.run()
          print(f'Successfully indexed {len(docs)} documents and {len(chunks)} chunks.')
          assert len(docs) >= 5, 'Insufficient documents loaded'
          "
